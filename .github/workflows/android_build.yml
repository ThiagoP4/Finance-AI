name: Build and Release Android APK

on:
  push:
    branches: [ "main", "refactor/trabalho" ]
    tags:
      - 'v*' # Roda quando você criar uma tag tipo v1.0, v2.1, etc.
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write # OBRIGATÓRIO para criar releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Instalar Dependências (Web)
        run: |
          cd client
          npm install

      - name: Build do Projeto Vue
        run: |
          cd client
          npm run build

      - name: Configurar Java (Necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sincronizar Capacitor
        run: |
          cd client
          npx cap sync android

      - name: Dar permissão de execução ao Gradle
        run: chmod +x client/android/gradlew

      - name: Build do APK (Debug)
        run: |
          cd client/android
          ./gradlew assembleDebug

      # Este passo cria a Release oficial no GitHub
      - name: Criar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Este passo envia o código Vue direto para os celulares (Live Update)
      - name: Deploy Live Update (Capgo)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd client
          npx @capgo/cli@latest bundle upload --apikey "${{ secrets.CAPGO_TOKEN }}" --app-id com.somma.ai --channel production --external

      # Mantive o upload de artefato para você poder testar sem precisar de tag
      - name: Upload do APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
